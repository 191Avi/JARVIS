<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JARVIS v6 — Control Panel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: #e0e6f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #0d1226;
      border-bottom: 1px solid #1e3a5f;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header h1 { font-size: 1.3rem; color: #4fc3f7; letter-spacing: 2px; }
    #status-dot {
      width: 10px; height: 10px; border-radius: 50%;
      background: #f44336; margin-left: auto;
    }
    #status-dot.online { background: #4caf50; }
    #status-text { font-size: 0.8rem; color: #78909c; }

    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: 260px;
      background: #0d1226;
      border-right: 1px solid #1e3a5f;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 12px;
      overflow-y: auto;
    }
    .sidebar h3 { font-size: 0.75rem; color: #4fc3f7; letter-spacing: 1px; text-transform: uppercase; }
    .tool-badge {
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.8rem;
      color: #90caf9;
    }
    .tool-badge span { color: #78909c; display: block; font-size: 0.72rem; margin-top: 2px; }

    #history-list { display: flex; flex-direction: column; gap: 6px; }
    .history-item {
      background: #112240;
      border-radius: 6px;
      padding: 8px 10px;
      font-size: 0.75rem;
      color: #90caf9;
      cursor: default;
    }
    .history-item .time { color: #546e7a; font-size: 0.68rem; }
    .history-item .tool-tag {
      display: inline-block;
      background: #1a3a6b;
      color: #4fc3f7;
      border-radius: 4px;
      padding: 1px 6px;
      font-size: 0.68rem;
      margin-top: 3px;
    }

    /* ===== CHAT AREA ===== */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.5;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: #1565c0;
      color: #e3f2fd;
      border-bottom-right-radius: 2px;
    }
    .msg.jarvis {
      align-self: flex-start;
      background: #112240;
      color: #e0e6f0;
      border-bottom-left-radius: 2px;
      border: 1px solid #1e3a5f;
    }
    .msg.jarvis .tool-label {
      font-size: 0.72rem;
      color: #4fc3f7;
      margin-bottom: 4px;
    }
    .msg.system {
      align-self: center;
      background: transparent;
      color: #546e7a;
      font-size: 0.78rem;
      font-style: italic;
    }

    /* ===== INPUT BAR ===== */
    .input-bar {
      padding: 16px 24px;
      background: #0d1226;
      border-top: 1px solid #1e3a5f;
      display: flex;
      gap: 10px;
    }
    #prompt-input {
      flex: 1;
      background: #112240;
      border: 1px solid #1e3a5f;
      border-radius: 8px;
      padding: 10px 14px;
      color: #e0e6f0;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    #prompt-input:focus { border-color: #4fc3f7; }
    #prompt-input::placeholder { color: #546e7a; }

    button {
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.85; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    #send-btn  { background: #1565c0; color: #fff; }
    #voice-btn { background: #1b5e20; color: #fff; min-width: 48px; }
    #voice-btn.listening { background: #b71c1c; animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.5; }
    }
  </style>
</head>
<body>

<header>
  <h1>JARVIS v6</h1>
  <span id="status-text">Connecting...</span>
  <div id="status-dot"></div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h3>Tools</h3>
    <div id="tools-list"><div class="tool-badge">Loading...</div></div>

    <h3 style="margin-top:8px">Recent History</h3>
    <div id="history-list"><div class="history-item">Loading...</div></div>
  </aside>

  <!-- Chat -->
  <div class="chat-area">
    <div id="messages">
      <div class="msg system">JARVIS v6 Production AI System — type or speak your task</div>
    </div>

    <div class="input-bar">
      <input id="prompt-input" type="text" placeholder="Ask JARVIS anything..." autocomplete="off" />
      <button id="voice-btn" title="Voice input">🎙️</button>
      <button id="send-btn">Send</button>
    </div>
  </div>
</div>

<script>
  const API = "http://localhost:8000";
  const messages   = document.getElementById("messages");
  const input      = document.getElementById("prompt-input");
  const sendBtn    = document.getElementById("send-btn");
  const voiceBtn   = document.getElementById("voice-btn");
  const statusDot  = document.getElementById("status-dot");
  const statusText = document.getElementById("status-text");

  // ===== HEALTH CHECK =====
  async function checkHealth() {
    try {
      const res = await fetch(`${API}/health`);
      const data = await res.json();
      statusDot.classList.add("online");
      statusText.textContent = `Online — v${data.version}`;
    } catch {
      statusDot.classList.remove("online");
      statusText.textContent = "Backend offline";
      addMsg("system", "Cannot reach backend. Run run_backend.bat first.");
    }
  }

  // ===== LOAD TOOLS =====
  async function loadTools() {
    try {
      const res  = await fetch(`${API}/tools`);
      const data = await res.json();
      const list = document.getElementById("tools-list");
      list.innerHTML = data.tools.map(t =>
        `<div class="tool-badge">${t.name}<span>${t.description}</span></div>`
      ).join("");
    } catch { /* silent */ }
  }

  // ===== LOAD HISTORY =====
  async function loadHistory() {
    try {
      const res  = await fetch(`${API}/history?limit=8`);
      const data = await res.json();
      const list = document.getElementById("history-list");
      if (!data.history.length) {
        list.innerHTML = '<div class="history-item">No history yet.</div>';
        return;
      }
      list.innerHTML = data.history.slice(0, 8).map(h =>
        `<div class="history-item">
          <div class="time">${h.time}</div>
          <div>${h.input.substring(0, 40)}${h.input.length > 40 ? "…" : ""}</div>
          ${h.tool ? `<span class="tool-tag">${h.tool}</span>` : ""}
        </div>`
      ).join("");
    } catch { /* silent */ }
  }

  // ===== ADD MESSAGE =====
  function addMsg(role, text, tool = null) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    if (role === "jarvis" && tool) {
      div.innerHTML = `<div class="tool-label">Tool used: ${tool}</div>${escHtml(text)}`;
    } else {
      div.textContent = text;
    }
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;
  }

  function escHtml(s) {
    return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  // ===== SEND =====
  async function send() {
    const prompt = input.value.trim();
    if (!prompt) return;
    input.value = "";
    addMsg("user", prompt);
    sendBtn.disabled = true;

    try {
      const res  = await fetch(`${API}/chat`, {
        method:  "POST",
        headers: {"Content-Type": "application/json"},
        body:    JSON.stringify({ prompt })
      });
      const data = await res.json();
      if (!res.ok) {
        addMsg("jarvis", `Error: ${data.detail || "Unknown error"}`);
      } else {
        addMsg("jarvis", data.response, data.tool_used);
        loadHistory();
      }
    } catch (e) {
      addMsg("system", "Backend unreachable. Is run_backend.bat running?");
    } finally {
      sendBtn.disabled = false;
      input.focus();
    }
  }

  // ===== VOICE INPUT (Web Speech API) =====
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.lang = "en-US";
    recognition.interimResults = false;

    recognition.onresult = (e) => {
      input.value = e.results[0][0].transcript;
      voiceBtn.classList.remove("listening");
      send();
    };
    recognition.onerror = () => voiceBtn.classList.remove("listening");
    recognition.onend   = () => voiceBtn.classList.remove("listening");

    voiceBtn.addEventListener("click", () => {
      voiceBtn.classList.add("listening");
      recognition.start();
    });
  } else {
    voiceBtn.title = "Voice not supported in this browser. Use Chrome.";
    voiceBtn.disabled = true;
  }

  // ===== EVENTS =====
  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });

  // ===== INIT =====
  checkHealth();
  loadTools();
  loadHistory();
  setInterval(loadHistory, 15000);
</script>
</body>
</html>
